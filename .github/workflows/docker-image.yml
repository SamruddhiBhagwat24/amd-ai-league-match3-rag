name: Validate Match 3 Docker Build

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required project files
        run: |
          test -f Dockerfile
          test -f app/app.py
          test -f app/server.py
          test -f app/requirements.txt
          echo "Project files are present."
